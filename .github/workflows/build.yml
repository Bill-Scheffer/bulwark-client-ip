# Builds Bulwark from its own release source with eight patches. Nine earlier ones (0003, 0006, 0008-0014) were
# retired at 1.21.2 because upstream now does what each did (README, "Retired patches"; MainThrive MAI-1442).
#   0001-forward-client-ip-to-jmap.patch: server-side requests to the configured JMAP server can go to
#     a private URL and carry the visitor's IP (opt-in: JMAP_SERVER_INTERNAL_URL,
#     JMAP_FORWARD_CLIENT_IP). Without it, every visitor's wrong password counts against the webmail
#     server's own address at the JMAP server, and one attacker can get that address banned, locking
#     every user out. Upstream forwards the address on some routes since 1.16, but sends nothing when it
#     has none, so the server falls back to this pod's own address; 0001 sends 192.0.2.1 instead.
#   0002-push-relay-build-arg.patch: a build argument for the default push relay
#     (NEXT_PUBLIC_PUSH_RELAY_URL), which upstream reads at build time but its Dockerfile never passes.
#     This build sets it to PUSH_RELAY_URL below, so the client never contacts the hosted relay.
#   0004-notification-badge.patch: the notification badge (Android's status-bar icon) can have its own
#     image (PWA_BADGE_URL), in all four of the service worker's notifications. Android draws the badge from
#     its alpha channel alone, so an opaque PWA icon is a solid square there.
#   0005-push-preview-says-why.patch: the push preview logs a warning where it answers 401 without a word
#     (never a value; the names of the cookies that came), so a generic notification can be traced.
#   0007-push-preview-restores-oauth-session.patch: a token sign-in (password plus two-step) whose browser was
#     restarted keeps only its refresh token, sign-in stamp and server cookie; the preview renews from them
#     through upstream's own renewal and rebuilds the context. Upstream rebuilds only a remembered Basic sign-in.
#   0015-ios-safari-install-steps.patch: on an iPhone or iPad in Safari, which never fires beforeinstallprompt, the
#     Install card shows the Add to Home Screen steps (MainThrive MAI-1181).
#   0016-shared-store-postgres.patch: a PostgreSQL backend for upstream's shared store (#1066), beside local and
#     redis, with SHARED_STORE=postgres: everything two instances behind one load balancer must agree on, in one
#     database (MainThrive MAI-1406, MAI-1442). It carries over the settings the earlier 0016 kept. Adds `pg`.
#   0017-no-link-mobile-app.patch: Settings > Security shows no "Link mobile app" card, for Bulwark's own phone app,
#     which MainThrive neither documents nor supports (MainThrive MAI-1442).
# Everything else is upstream: the tag's source, its Dockerfile. The image is pushed only after an
# end-to-end check against the built image passes. The release tag is pushed only from main; a dispatch
# from another branch pushes branch-<short sha> instead, and a pull request runs every step but the
# registry login and the push (MAI-1019). A release tag is pushed once and never re-pushed, so changing
# what is built means bumping VERSION (MAI-1021).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Any new directory the build reads goes here too, or merging a change to it never rebuilds main.
    paths: [".github/workflows/build.yml", "patches/**", "scripts/**"]
  # No path filter: this job is the required check on main, and a check filtered out of a pull
  # request never reports, so that pull request could never merge.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One group per ref: main builds one at a time and never cancels, and each pull request
# (refs/pull/N/merge) has its own group, where a new push cancels its older run. Keyed on the ref
# rather than the event, so a dispatch from a feature branch cannot displace main's pending build:
# a group holds one pending run, and a newer one cancels it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Upstream Bulwark release, pinned by commit: a tag can move, a commit cannot.
  BULWARK_TAG: "1.22.0"
  BULWARK_SHA: 2ee1e031d75fa85b0f36776e09bac6b67371f6dc
  IMAGE: ghcr.io/bill-scheffer/bulwark-client-ip
  VERSION: 1.21.2-clientip.20
  # Our self-hosted push relay (github.com/Bill-Scheffer/bulwark-relay-hardened), served under the
  # webmail host. Baked into the client bundle.
  PUSH_RELAY_URL: https://webmail.mainthrive.com/relay

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: patch

      - name: Check out Bulwark at the pinned release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: bulwarkmail/webmail
          ref: ${{ env.BULWARK_SHA }}
          path: bulwark

      - name: The release tag still names that commit
        run: |
          set -eu
          tagged=$(git ls-remote https://github.com/bulwarkmail/webmail "refs/tags/${BULWARK_TAG}" | cut -f1)
          echo "tag ${BULWARK_TAG} -> ${tagged}"
          [ "$tagged" = "$BULWARK_SHA" ] || { echo "::error::${BULWARK_TAG} no longer points at ${BULWARK_SHA}"; exit 1; }

      # ⛔ A release tag names one image, forever (MAI-1021). A main build used to re-push it with a new digest even
      # when only this workflow changed, which left the digest production pins untagged, and an untagged version is
      # the first thing a registry cleanup deletes. So a tag that already exists is never re-pushed, and a change to
      # what goes into the image must bump VERSION; this fails a pull request that makes one without the bump. What
      # goes in: patches/**, any other file of this repo that a step up to the image build names (patch/<path>),
      # the env: values (the upstream commit, the push relay URL, the tag itself), and every step up to and
      # including the image build, comments aside. The CI-only reference images and this step itself are left out.
      # The package is public, so this reads it without logging in.
      - name: The release tag is new, or already names this content (it is never re-pushed)
        id: release
        run: |
          set -eu
          tag="${VERSION}"
          if ! have=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>&1); then
            case "$have" in *": not found"*) ;; *) echo "::error::cannot read ${IMAGE}:${tag}: ${have}"; exit 1 ;; esac
            echo "${tag} is new: a main build publishes it"
            echo publish=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r digest rev <<< "$have"
          [[ "${rev:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}:${tag} carries no revision label (got '${have}')"; exit 1; }
          git -C patch fetch -q --depth=1 origin "$rev"
          # build.yml from env: through the image build step, minus comments, the reference images and this step.
          inputs_of() {
            git -C patch show "$1:.github/workflows/build.yml" | awk '
              /^env:/ { on = 1 }
              /^      - / { if (build) exit; skip = /name: The release tag is new/; build = /name: Build with/ }
              on && !skip && !/^[[:space:]]*(#|$)/ && !/REFERENCE_IMAGE/'
          }
          # This repo's files those steps name: patches/** today. A script added before the build is then covered too.
          refs=$(inputs_of HEAD | { grep -oE '(^|[^[:alnum:]_-])patch/[[:alnum:]_./-]+' || true; } | sed -E 's#^[^p]?patch/##' | sort -u)
          changed=$(git -C patch diff --name-only "$rev" HEAD -- patches $refs)
          [ "$(inputs_of "$rev")" = "$(inputs_of HEAD)" ] || changed="${changed} build.yml"
          if [ -n "$changed" ]; then
            echo "::error::${tag} already names ${digest}, built from ${rev}, and what goes into the image changed since:" $changed "-- bump VERSION"
            exit 1
          fi
          echo "${tag} already names ${digest}, built from ${rev}; nothing that goes into the image changed, so it is not re-pushed"
          echo publish=false >> "$GITHUB_OUTPUT"

      - name: Apply the patches, and prove they changed exactly their files
        working-directory: bulwark
        run: |
          set -eu
          for p in ../patch/patches/0001-forward-client-ip-to-jmap.patch ../patch/patches/0002-push-relay-build-arg.patch \
                   ../patch/patches/0004-notification-badge.patch \
                   ../patch/patches/0005-push-preview-says-why.patch \
                   ../patch/patches/0007-push-preview-restores-oauth-session.patch \
                   ../patch/patches/0015-ios-safari-install-steps.patch \
                   ../patch/patches/0016-shared-store-postgres.patch \
                   ../patch/patches/0017-no-link-mobile-app.patch; do
            git apply --check "$p"
            git apply "$p"
          done
          got=$(git status --porcelain | LC_ALL=C sort | tr '\n' '|')
          want=$(printf '%s\n' ' M .env.example' ' M Dockerfile' ' M app/api/push/preview/route.ts' ' M app/api/pwa-icon/[size]/route.ts' \
            ' M components/pwa-install-prompt.tsx' ' M components/settings/__tests__/link-device-section.test.tsx' \
            ' M components/settings/account-security-settings.tsx' ' M instrumentation.node.ts' ' M lib/admin/types.ts' \
            ' M lib/shared-store/index.ts' ' M lib/shared-store/types.ts' ' M lib/stalwart/push-token-renewal.ts' \
            ' M locales/en/common.json' ' M package-lock.json' ' M package.json' ' M public/sw.js' \
            '?? components/__tests__/pwa-install-prompt-ios.test.tsx' '?? lib/__tests__/jmap-upstream-fetch.test.ts' \
            '?? lib/__tests__/pwa-icon-badge.test.ts' '?? lib/server/' '?? lib/shared-store/__tests__/postgres-store.test.ts' \
            '?? lib/shared-store/postgres.ts' | LC_ALL=C sort | tr '\n' '|')
          [ "$got" = "$want" ] || { echo "::error::unexpected change set: $got"; exit 1; }
          # The one new directory holds exactly 0001's file (git status names the directory, not its contents).
          [ "$(ls -A lib/server)" = jmap-upstream-fetch.ts ] || { echo "::error::lib/server holds more than 0001's file: $(ls -A lib/server)"; exit 1; }
          # 0004: every notification the service worker shows asks for the badge, none for the plain icon.
          [ "$(grep -cF 'badge: `${BASE_PATH}/api/pwa-icon/192?purpose=badge`' public/sw.js)" = 4 ] \
            && ! grep -nF 'badge: `${BASE_PATH}/api/pwa-icon/192`,' public/sw.js \
            || { echo "::error::a notification's badge is still the PWA icon"; exit 1; }
          # 0005: the preview's silent 401s say why.
          grep -qF "logger.warn('push preview could not open the session'" app/api/push/preview/route.ts \
            && grep -qF "logger.warn('push preview found no session for the account'" app/api/push/preview/route.ts \
            && grep -qF "logger.warn('push preview found no session context'" app/api/push/preview/route.ts \
            || { echo "::error::the push preview still answers 401 without a word"; exit 1; }
          # 0007: a token sign-in that kept only its refresh token is rebuilt for the preview.
          grep -qF 'await restorePushContextFromRefreshToken(cookieStore, restoreSlot, basePath' app/api/push/preview/route.ts \
            || { echo "::error::the preview does not rebuild a token sign-in from its refresh token"; exit 1; }
          # 0015: iOS Safari gets the install steps once signed in, and only while the app is not opened from the Home Screen.
          grep -qF 'const show = isAuthenticated && !isStandalone();' components/pwa-install-prompt.tsx \
            || { echo "::error::iOS Safari still gets no install card"; exit 1; }
          # 0016: SHARED_STORE=postgres selects the PostgreSQL backend; the only dependency added is pg (and its types).
          grep -qF 'if (postgresStoreSelected()) return POSTGRES_URL;' lib/shared-store/index.ts \
            && grep -qF '? createPostgresStore()' lib/shared-store/index.ts \
            || { echo "::error::SHARED_STORE=postgres does not select the PostgreSQL store"; exit 1; }
          [ "$(git diff -U0 package.json | grep -E '^\+ ' | tr -d ' ' | LC_ALL=C sort | tr '\n' '|')" = '+"@types/pg":"8.23.1",|+"pg":"8.23.1",|' ] \
            || { echo "::error::package.json changed beyond pg 8.23.1 and its types"; exit 1; }
          # 0017: no Link mobile app card, on either of the Security page's layouts.
          grep -qF 'const OFFER_MOBILE_APP = false;' components/settings/account-security-settings.tsx \
            && [ "$(grep -cF '{OFFER_MOBILE_APP && ' components/settings/account-security-settings.tsx)" = 2 ] \
            || { echo "::error::the Security page still offers Link mobile app"; exit 1; }

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "24"

      - name: The patches' own tests, the suites they touch, and the typecheck
        working-directory: bulwark
        run: |
          set -eu
          npm ci --no-audit --no-fund --ignore-scripts
          # The cold first import of a route test takes several seconds on a busy machine; the default 5 s is a flake.
          npx vitest run --testTimeout=30000 \
            lib/__tests__/jmap-upstream-fetch.test.ts lib/__tests__/pwa-icon-badge.test.ts \
            lib/__tests__/push-preview-route.test.ts lib/__tests__/push-preview-route-ambiguous.test.ts \
            lib/__tests__/push-preview-route-owner.test.ts lib/__tests__/push-preview-token-renewal.test.ts \
            lib/__tests__/push-auth-context.test.ts lib/__tests__/push-preview-device-policy.test.ts \
            lib/__tests__/sw-push-delivery.test.ts lib/__tests__/settings-route-account-key.test.ts \
            components/__tests__/pwa-install-prompt.test.tsx components/__tests__/pwa-install-prompt-ios.test.tsx \
            components/settings/__tests__/link-device-section.test.tsx components/settings/__tests__/account-security-signin.test.tsx \
            components/settings/__tests__/account-security-mail-apps.test.tsx \
            lib/shared-store
          npx tsc --noEmit -p tsconfig.json

      - name: The shared store contract (upstream's) against a real PostgreSQL, for 0016
        working-directory: bulwark
        run: |
          set -eu
          pw=$(openssl rand -hex 16)
          docker run -d --name contract-pg -p 127.0.0.1:55432:5432 -e POSTGRES_USER=bulwark -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=bulwark postgres:18.4 >/dev/null
          for _ in $(seq 1 60); do docker exec contract-pg pg_isready -h 127.0.0.1 -U bulwark -d bulwark >/dev/null 2>&1 && break; sleep 1; done
          IT_SHARED_STORE_PG=1 PGHOST=127.0.0.1 PGPORT=55432 PGUSER=bulwark PGDATABASE=bulwark PGPASSWORD="$pw" PGSSLMODE=disable \
            npx vitest run --testTimeout=60000 lib/shared-store/__tests__/postgres-store.test.ts
          docker rm -f contract-pg >/dev/null

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build with Bulwark's own Dockerfile (loaded locally, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: bulwark
          file: bulwark/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            GIT_COMMIT=${{ env.BULWARK_SHA }}
            NEXT_PUBLIC_PUSH_RELAY_URL=${{ env.PUSH_RELAY_URL }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=Bulwark ${{ env.BULWARK_TAG }} with server-side JMAP requests sent privately and carrying the client IP, ${{ env.PUSH_RELAY_URL }} as its push relay, a notification badge of its own, and its shared store on PostgreSQL
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          # Only main writes the cache: a pull request reads main's, and a build cache written per
          # pull request would evict main's from the repository's 10 GB.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: End-to-end against the built image
        run: bash patch/scripts/e2e.sh "${IMAGE}:${VERSION}" "${PUSH_RELAY_URL}"

      - name: End-to-end, a real Stalwart - the push preview after the access token expired, and after a restart
        run: bash patch/scripts/e2e-preview-renewal.sh "${IMAGE}:${VERSION}" renews

      - name: End-to-end, the notification badge has its own image
        run: bash patch/scripts/e2e-badge.sh "${IMAGE}:${VERSION}"

      - name: End-to-end, a phone-sized browser - a send from the list returns to the list
        run: bash patch/scripts/e2e-mobile-send.sh "${IMAGE}:${VERSION}"

      - name: End-to-end, Safari on an iPhone - the Install card shows the Add to Home Screen steps
        run: bash patch/scripts/e2e-ios-install.sh "${IMAGE}:${VERSION}"

      - name: End-to-end, two instances and a real PostgreSQL - settings and a pairing code shared across them
        run: bash patch/scripts/e2e-shared-store.sh "${IMAGE}:${VERSION}" shared

      - name: End-to-end, the same two instances with the store off - each keeps its own (the negative control)
        run: bash patch/scripts/e2e-shared-store.sh "${IMAGE}:${VERSION}" separate

      - name: End-to-end, the upgrade - settings today's image saved are what both instances of this one load
        run: bash patch/scripts/e2e-shared-store.sh "${IMAGE}:${VERSION}" upgrade

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any
      # other branch pushes the same tested image under branch-<short sha> alone, never the release tag,
      # so a lane can pin it by digest before merge. A pull request (ref refs/pull/N/merge) never logs in
      # or pushes.
      - if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, only after the end-to-end check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          tag="${VERSION}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${tag}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${IMAGE}:${tag} ${digest#*@}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
            echo "- bulwark: \`${BULWARK_TAG}\` @ \`${BULWARK_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
