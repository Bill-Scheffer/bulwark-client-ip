# Builds Bulwark from its own release source with fifteen patches:
#   0001-forward-client-ip-to-jmap.patch: server-side requests to the configured JMAP server can go to
#     a private URL and carry the visitor's IP (opt-in: JMAP_SERVER_INTERNAL_URL,
#     JMAP_FORWARD_CLIENT_IP). Without it, every visitor's wrong password counts against the webmail
#     server's own address at the JMAP server, and one attacker can get that address banned, locking
#     every user out.
#   0002-push-relay-build-arg.patch: a build argument for the default push relay
#     (NEXT_PUBLIC_PUSH_RELAY_URL), which upstream reads at build time but its Dockerfile never passes.
#     This build sets it to PUSH_RELAY_URL below, so the client never contacts the hosted relay.
#   0003-push-preview-renews-expired-session.patch: the push preview renews an expired OAuth access
#     token with the session's refresh token, as the open app does, so a notification still names the
#     sender and subject when the app has not been open for an hour. Without it, every notification
#     after the token's lifetime reads "You have new mail".
#   0004-notification-badge.patch: the notification badge (Android's status-bar icon) can have its own
#     image (PWA_BADGE_URL). Android draws the badge from its alpha channel alone, so an opaque PWA icon
#     is a solid square there; the icon itself stays opaque, because it is also the maskable icon.
#   0005-push-preview-says-why.patch: the push preview logs a warning on each path that answers 401
#     (never a value; the no-session case names which cookies arrived), so a generic notification
#     can be traced to its cause.
#   0006-push-preview-restores-remembered-session.patch: a "remember me" sign-in keeps a 30-day cookie
#     but its context cookie ends with the browser session, so a phone's browser restarted by a push
#     comes back without it and the preview answered 401. The preview now rebuilds the context from
#     the remembered sign-in, through the helper the app's own restore uses.
#   0007-push-preview-restores-oauth-session.patch: the same for an OAuth sign-in (what a TOTP account
#     gets), which keeps only its 30-day refresh token across that restart: the preview renews from it,
#     opens the session, and stores the rebuilt context only once that has worked.
#   0008-files-no-stability-banner.patch: the Files page no longer shows its "Large file uploads can
#     cause server instability" banner. It describes Stalwart on RocksDB; ours is PostgreSQL + R2, where
#     a file's bytes go to R2 (measured). Stalwart bounds each upload (25 MiB per request and per file)
#     and each account (4 requests at once); a server-wide bound is tracked as a scaling item, not
#     left to a banner (MAI-263).
#   0009-files-upload-errors-say-why.patch: a refused Files upload shows the server's reason (malware,
#     could not be scanned, too large) after "Failed to upload file", not the bare generic toast.
#   0010-restore-keeps-session-through-outage.patch: a page load during a server outage keeps the
#     remembered sign-in. The restore signed the user out on a request timeout, or on a fetch that
#     failed while a re-probe got through (what a load balancer switching origins produces); both are
#     now treated as the outage they are. A real rejection still signs out.
#   0011-token-session-keeps-account-security.patch: a two-step sign-in (a token session) shows Change
#     Password, Display Name and Two-Factor Authentication, as a password sign-in does; upstream hid them,
#     so a two-step user could not change their password or turn two-step off (Stalwart accepts all three
#     on the bearer token, measured). After a password change, which revokes the session's tokens, the
#     session signs in again with the new password and the confirming code. Email Client Setup and Link
#     Mobile App (for upstream's own app and JMAP clients, which this deployment does not offer) are no longer shown.
#   0012-totp-issuer-is-app-name.patch: the otpauth URL a two-step enrolment shows names this webmail
#     (APP_NAME) as its issuer, not 'Stalwart', so the user's authenticator app names the entry after the
#     service they signed up for (MainThrive MAI-947).
#   0013-mobile-send-returns-to-list.patch: on a phone, sending a new message from the list returns to
#     the list. Upstream closed the composer and left the reading pane up with nothing in it, so the user
#     landed on "No conversation selected" (MainThrive MAI-1010). A reply still returns to its message.
#   0014-password-change-asks-for-the-next-code.patch: after a password change in a two-step session, the form asks
#     for the NEXT code to stay signed in, instead of 0011's re-sign-in with the code the change was confirmed with:
#     MainThrive's Stalwart accepts a code once (stalwart-r2-patch 0012, MAI-997), so that reuse is refused. A refused
#     code is asked for again; declining, or leaving the page, ends the session as expired, as before 0011.
#   0015-ios-safari-install-steps.patch: on an iPhone or iPad in Safari, which never fires beforeinstallprompt, the
#     Install card shows the Add to Home Screen steps, with an arrow toward Safari's toolbar, instead of never
#     appearing. Once signed in, never once the app is opened from the Home Screen, nor in another iOS browser
#     (MainThrive MAI-1181).
# Everything else is upstream: the tag's source, its Dockerfile. The image is pushed only after an
# end-to-end check against the built image passes. The release tag is pushed only from main; a dispatch
# from another branch pushes branch-<short sha> instead, and a pull request runs every step but the
# registry login and the push (MAI-1019). A release tag is pushed once and never re-pushed, so changing
# what is built means bumping VERSION (MAI-1021).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Any new directory the build reads goes here too, or merging a change to it never rebuilds main.
    paths: [".github/workflows/build.yml", "patches/**", "scripts/**"]
  # No path filter: this job is the required check on main, and a check filtered out of a pull
  # request never reports, so that pull request could never merge.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One group per ref: main builds one at a time and never cancels, and each pull request
# (refs/pull/N/merge) has its own group, where a new push cancels its older run. Keyed on the ref
# rather than the event, so a dispatch from a feature branch cannot displace main's pending build:
# a group holds one pending run, and a newer one cancels it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Upstream Bulwark release, pinned by commit: a tag can move, a commit cannot.
  BULWARK_TAG: "1.11.2"
  BULWARK_SHA: e2a414593906ea01bc120bb96bf6428932a1590e
  IMAGE: ghcr.io/bill-scheffer/bulwark-client-ip
  VERSION: 1.11.2-clientip.17
  # Our self-hosted push relay (github.com/Bill-Scheffer/bulwark-relay-hardened), served under the
  # webmail host. Baked into the client bundle.
  PUSH_RELAY_URL: https://webmail.mainthrive.com/relay

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: patch

      - name: Check out Bulwark at the pinned release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: bulwarkmail/webmail
          ref: ${{ env.BULWARK_SHA }}
          path: bulwark

      - name: The release tag still names that commit
        run: |
          set -eu
          tagged=$(git ls-remote https://github.com/bulwarkmail/webmail "refs/tags/${BULWARK_TAG}" | cut -f1)
          echo "tag ${BULWARK_TAG} -> ${tagged}"
          [ "$tagged" = "$BULWARK_SHA" ] || { echo "::error::${BULWARK_TAG} no longer points at ${BULWARK_SHA}"; exit 1; }

      # ⛔ A release tag names one image, forever (MAI-1021). A main build used to re-push it with a new digest even
      # when only this workflow changed, which left the digest production pins untagged, and an untagged version is
      # the first thing a registry cleanup deletes. So a tag that already exists is never re-pushed, and a change to
      # what goes into the image must bump VERSION; this fails a pull request that makes one without the bump. What
      # goes in: patches/**, any other file of this repo that a step up to the image build names (patch/<path>),
      # the env: values (the upstream commit, the push relay URL, the tag itself), and every step up to and
      # including the image build, comments aside. The CI-only reference images and this step itself are left out.
      # The package is public, so this reads it without logging in.
      - name: The release tag is new, or already names this content (it is never re-pushed)
        id: release
        run: |
          set -eu
          tag="${VERSION}"
          if ! have=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>&1); then
            case "$have" in *": not found"*) ;; *) echo "::error::cannot read ${IMAGE}:${tag}: ${have}"; exit 1 ;; esac
            echo "${tag} is new: a main build publishes it"
            echo publish=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r digest rev <<< "$have"
          [[ "${rev:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}:${tag} carries no revision label (got '${have}')"; exit 1; }
          git -C patch fetch -q --depth=1 origin "$rev"
          # build.yml from env: through the image build step, minus comments, the reference images and this step.
          inputs_of() {
            git -C patch show "$1:.github/workflows/build.yml" | awk '
              /^env:/ { on = 1 }
              /^      - / { if (build) exit; skip = /name: The release tag is new/; build = /name: Build with/ }
              on && !skip && !/^[[:space:]]*(#|$)/ && !/REFERENCE_IMAGE/'
          }
          # This repo's files those steps name: patches/** today. A script added before the build is then covered too.
          refs=$(inputs_of HEAD | { grep -oE '(^|[^[:alnum:]_-])patch/[[:alnum:]_./-]+' || true; } | sed -E 's#^[^p]?patch/##' | sort -u)
          changed=$(git -C patch diff --name-only "$rev" HEAD -- patches $refs)
          [ "$(inputs_of "$rev")" = "$(inputs_of HEAD)" ] || changed="${changed} build.yml"
          if [ -n "$changed" ]; then
            echo "::error::${tag} already names ${digest}, built from ${rev}, and what goes into the image changed since:" $changed "-- bump VERSION"
            exit 1
          fi
          echo "${tag} already names ${digest}, built from ${rev}; nothing that goes into the image changed, so it is not re-pushed"
          echo publish=false >> "$GITHUB_OUTPUT"

      - name: Apply the patches, and prove they changed exactly their files
        working-directory: bulwark
        run: |
          set -eu
          for p in ../patch/patches/0001-forward-client-ip-to-jmap.patch ../patch/patches/0002-push-relay-build-arg.patch \
                   ../patch/patches/0003-push-preview-renews-expired-session.patch \
                   ../patch/patches/0004-notification-badge.patch \
                   ../patch/patches/0005-push-preview-says-why.patch \
                   ../patch/patches/0006-push-preview-restores-remembered-session.patch \
                   ../patch/patches/0007-push-preview-restores-oauth-session.patch \
                   ../patch/patches/0008-files-no-stability-banner.patch \
                   ../patch/patches/0009-files-upload-errors-say-why.patch \
                   ../patch/patches/0010-restore-keeps-session-through-outage.patch \
                   ../patch/patches/0011-token-session-keeps-account-security.patch \
                   ../patch/patches/0012-totp-issuer-is-app-name.patch \
                   ../patch/patches/0013-mobile-send-returns-to-list.patch \
                   ../patch/patches/0014-password-change-asks-for-the-next-code.patch \
                   ../patch/patches/0015-ios-safari-install-steps.patch; do
            git apply --check "$p"
            git apply "$p"
          done
          got=$(git status --porcelain | LC_ALL=C sort | tr '\n' '|')
          want=$(printf '%s\n' ' M Dockerfile' ' M instrumentation.node.ts' '?? lib/__tests__/jmap-upstream-fetch.test.ts' '?? lib/server/' \
            ' M app/api/auth/token/route.ts' ' M app/api/push/preview/route.ts' ' M lib/__tests__/push-preview-route.test.ts' \
            '?? lib/oauth/refresh-slot.ts' '?? lib/__tests__/refresh-slot.test.ts' \
            ' M .env.example' ' M app/api/pwa-icon/[size]/route.ts' ' M lib/admin/types.ts' ' M public/sw.js' \
            '?? lib/__tests__/pwa-icon-badge.test.ts' \
            ' M app/api/auth/session/route.ts' ' M lib/stalwart/auth-context.ts' '?? lib/__tests__/auth-context-restore.test.ts' \
            ' M components/files/files-app.tsx' \
            ' M stores/auth-store.ts' '?? stores/__tests__/auth-store-restore-outage.test.ts' \
            ' M components/settings/account-security-settings.tsx' ' M stores/account-security-store.ts' \
            ' M stores/__tests__/account-security-store.test.ts' '?? stores/__tests__/auth-store-token-password.test.ts' \
            '?? components/settings/__tests__/account-security-token-session.test.tsx' \
            '?? components/settings/__tests__/account-security-totp-issuer.test.tsx' \
            ' M components/mail/mail-app.tsx' \
            ' M locales/en/common.json' '?? components/settings/__tests__/account-security-next-code.test.tsx' \
            ' M components/pwa-install-prompt.tsx' '?? components/__tests__/pwa-install-prompt-ios.test.tsx' | LC_ALL=C sort | tr '\n' '|')
          [ "$got" = "$want" ] || { echo "::error::unexpected change set: $got"; exit 1; }
          # 0008: the Files page renders no stability banner.
          ! grep -n 'stability_warning' components/files/files-app.tsx || { echo "::error::the Files banner is still rendered"; exit 1; }
          # 0009: both Files upload handlers show the server's reason.
          [ "$(grep -cF 'toast.error(uploadErrorText(err));' components/files/files-app.tsx)" = 2 ] \
            && grep -qF 'err.message ? `${t("upload_error")}: ${err.message}`' components/files/files-app.tsx \
            || { echo "::error::a Files upload error does not show the server's reason"; exit 1; }
          # 0010: the restore counts a timeout and CORS_ERROR as an outage.
          grep -qF 'if (error instanceof RequestTimeoutError) return true;' stores/auth-store.ts \
            && grep -qF "if (error instanceof Error && error.message === 'CORS_ERROR') return true;" stores/auth-store.ts \
            || { echo "::error::the restore still signs out on a timeout or CORS_ERROR"; exit 1; }
          # 0011: no section of the Security page depends on how the session signed in, and a password
          # change renews a token session.
          ! grep -nE "isOAuth|authMode === 'oauth'" components/settings/account-security-settings.tsx \
            && grep -qF 'keepTokenSessionThrough(' stores/account-security-store.ts \
            || { echo "::error::a token session's Security page still differs, or a password change does not renew it"; exit 1; }
          # 0012: the TOTP issuer is the configured app name, never the mail server's.
          ! grep -n "issuer: 'Stalwart'" components/settings/account-security-settings.tsx \
            && grep -qF "generateTotp(client?.getUsername() ?? 'account', appName || 'Webmail')" components/settings/account-security-settings.tsx \
            || { echo "::error::the TOTP enrolment still names Stalwart as its issuer"; exit 1; }
          # 0013: both send paths return a phone to the list when nothing is left to read.
          [ "$(grep -cF 'returnToListIfNothingToRead();' components/mail/mail-app.tsx)" = 2 ] \
            || { echo "::error::a send on a phone still leaves the empty reading pane up"; exit 1; }
          # 0014: the re-sign-in after a password change asks for the next code, never reuses the confirming one.
          grep -qF 'const totp = nextCode ? await nextCode(tries > 0) : undefined;' stores/auth-store.ts \
            && ! grep -nF 'totp: otpCode,' stores/auth-store.ts \
            || { echo "::error::a password change still signs in again with the code it was confirmed with"; exit 1; }
          # 0015: iOS Safari gets the install steps once signed in, and only while the app is not opened from the Home Screen.
          grep -qF 'const show = isAuthenticated && !isStandalone();' components/pwa-install-prompt.tsx \
            || { echo "::error::iOS Safari still gets no install card"; exit 1; }

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "24"

      - name: The patches' own tests, the suites they touch, and the typecheck
        working-directory: bulwark
        run: |
          set -eu
          npm ci --no-audit --no-fund --ignore-scripts
          npx vitest run lib/__tests__/jmap-upstream-fetch.test.ts lib/__tests__/push-preview-route.test.ts lib/__tests__/refresh-slot.test.ts \
            lib/__tests__/oauth-token-route.test.ts lib/__tests__/auth-routes-same-origin.test.ts \
            lib/__tests__/pwa-icon-badge.test.ts lib/__tests__/domain-branding.test.ts lib/__tests__/branding-asset.test.ts \
            lib/__tests__/auth-context-restore.test.ts lib/__tests__/impersonation-session.test.ts \
            lib/__tests__/auth-routes-credential-check.test.ts lib/__tests__/settings-route-account-key.test.ts \
            lib/__tests__/wopi-token-not-a-session.test.ts stores/__tests__/auth-store-restore-outage.test.ts \
            stores/__tests__/auth-store-token-password.test.ts stores/__tests__/account-security-store.test.ts \
            components/settings/__tests__/account-security-token-session.test.tsx \
            components/settings/__tests__/account-security-totp-issuer.test.tsx \
            components/settings/__tests__/account-security-next-code.test.tsx \
            components/__tests__/pwa-install-prompt.test.tsx components/__tests__/pwa-install-prompt-ios.test.tsx
          npx tsc --noEmit -p tsconfig.json

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build with Bulwark's own Dockerfile (loaded locally, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: bulwark
          file: bulwark/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            GIT_COMMIT=${{ env.BULWARK_SHA }}
            NEXT_PUBLIC_PUSH_RELAY_URL=${{ env.PUSH_RELAY_URL }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=Bulwark ${{ env.BULWARK_TAG }} with server-side JMAP requests sent privately and carrying the client IP, ${{ env.PUSH_RELAY_URL }} as its push relay, push previews that renew an expired session, and a notification badge of its own
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          # Only main writes the cache: a pull request reads main's, and a build cache written per
          # pull request would evict main's from the repository's 10 GB.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: End-to-end against the built image
        run: bash patch/scripts/e2e.sh "${IMAGE}:${VERSION}" "${PUSH_RELAY_URL}"

      - name: End-to-end, a real Stalwart - the push preview after the access token expired
        run: bash patch/scripts/e2e-preview-renewal.sh "${IMAGE}:${VERSION}"

      - name: End-to-end, the notification badge has its own image
        run: bash patch/scripts/e2e-badge.sh "${IMAGE}:${VERSION}"

      - name: End-to-end, a phone-sized browser - a send from the list returns to the list
        run: bash patch/scripts/e2e-mobile-send.sh "${IMAGE}:${VERSION}"

      - name: End-to-end, Safari on an iPhone - the Install card shows the Add to Home Screen steps
        run: bash patch/scripts/e2e-ios-install.sh "${IMAGE}:${VERSION}"

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any
      # other branch pushes the same tested image under branch-<short sha> alone, never the release tag,
      # so a lane can pin it by digest before merge. A pull request (ref refs/pull/N/merge) never logs in
      # or pushes.
      - if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, only after the end-to-end check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          tag="${VERSION}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${tag}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${IMAGE}:${tag} ${digest#*@}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
            echo "- bulwark: \`${BULWARK_TAG}\` @ \`${BULWARK_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
